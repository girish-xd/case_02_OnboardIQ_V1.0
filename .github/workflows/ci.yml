name: OnboardIQ CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install & Test Backend
        run: |
          cd backend
          npm ci || npm install
          npx tsc --noEmit
          npm test

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Execute Evaluation Run Verification
        run: |
          cd backend
          npm run batch
          test -f ../output/decisions_output.csv
